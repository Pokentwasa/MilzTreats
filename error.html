<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Not Completed — Treats by Milz</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .error-page { min-height: 100vh; background: var(--black); color: var(--white); display: flex; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
  .error-card { max-width: 480px; }
  .error-card__eyebrow { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 1rem; }
  .error-card__heading { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: clamp(2.4rem, 7vw, 3.6rem); line-height: 0.95; margin-bottom: 1rem; }
  .error-card__body { color: rgba(255,255,255,0.65); margin-bottom: 2.25rem; line-height: 1.6; }
  .error-card .btn--ghost { border-color: rgba(255,255,255,0.4); color: var(--white); }
  .error-card .btn--ghost:hover { background: var(--white); color: var(--black); }
  .error-actions { display: flex; flex-direction: column; gap: 0.9rem; align-items: center; }
</style>
</head>
<body>

<div class="error-page">
  <div class="error-card">
    <p class="error-card__eyebrow">Treats by Milz</p>
    <h1 class="error-card__heading" id="errorHeading">Payment didn't<br>go through.</h1>
    <p class="error-card__body" id="errorBody">
      Your payment was cancelled or didn't complete, so nothing has been charged. You can try again whenever you're ready.
    </p>
    <div class="error-actions">
      <a href="/checkout.html" class="btn btn--primary"><span>Try Again</span></a>
      <a href="/#pricing" class="btn btn--ghost"><span>Back to Treats by Milz</span></a>
    </div>
  </div>
</div>

<script>
  // Ozow can redirect here with a status hint, e.g. /error.html?reason=cancelled
  (function () {
    var params = new URLSearchParams(window.location.search);
    var reason = params.get("reason");
    var body = document.getElementById("errorBody");
    if (reason === "cancelled") {
      body.textContent = "You cancelled the payment before it completed, so nothing has been charged. You can try again whenever you're ready.";
    } else if (reason === "failed") {
      body.textContent = "Ozow couldn't complete this payment. Nothing has been charged — please try again, or use a different account.";
    }
  })();
</script>
</body>
</html>
