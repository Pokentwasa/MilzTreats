<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Not Completed — Treats by Milz</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .error-page { min-height: 100vh; background: var(--cream-soft); display: flex; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
  .error-card { max-width: 480px; }
  .error-card__eyebrow { font-family: var(--font-body); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--pink-deep); margin-bottom: 1rem; }
  .error-card__heading { font-family: var(--font-display); font-weight: 500; font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.1; margin-bottom: 1rem; color: var(--ink); }
  .error-card__body { color: var(--body-ink); margin-bottom: 2.25rem; line-height: 1.65; }
  .error-actions { display: flex; flex-direction: column; gap: 0.9rem; align-items: center; }
</style>
</head>
<body>

<div class="error-page">
  <div class="error-card">
    <p class="error-card__eyebrow">Treats by Milz</p>
    <h1 class="error-card__heading" id="errorHeading">Payment didn't <span class="accent">go through.</span></h1>
    <p class="error-card__body" id="errorBody">
      Your payment was cancelled or didn't complete, so nothing has been charged. You can try again whenever you're ready.
    </p>
    <div class="error-actions">
      <a href="/checkout.html" class="btn btn--primary"><span>Try Again</span></a>
      <a href="/#pricing" class="text-link">Back to Treats by Milz</a>
    </div>
  </div>
</div>

<script>
  // checkout.html sends PayFast's cancel_url here as ?reason=cancelled — PayFast
  // has no separate failure redirect, so a real failed payment lands here too.
  // ?reason=failed is kept in case a future check (e.g. querying order status)
  // can tell the two apart.
  (function () {
    var params = new URLSearchParams(window.location.search);
    var reason = params.get("reason");
    var body = document.getElementById("errorBody");
    if (reason === "cancelled") {
      body.textContent = "Your payment was cancelled or didn't complete, so nothing has been charged. You can try again whenever you're ready.";
    } else if (reason === "failed") {
      body.textContent = "PayFast couldn't complete this payment. Nothing has been charged — please try again, or use a different payment method.";
    }
  })();
</script>
</body>
</html>
